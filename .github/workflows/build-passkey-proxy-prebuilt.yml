name: Build Browser Extension (passkey-proxy prebuilt)

on:
  workflow_dispatch:
  push:
    branches:
      - xrvk/passkey-proxy-prebuilt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Chrome extension (bit, prod)
        working-directory: apps/browser
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build:bit:prod:chrome

      - name: Verify forced flag defaults
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("libs/common/src/enums/feature-flag.enum.ts","utf8");
            const ok =
              /\[FeatureFlag\.UseWebAuthenticationProxy\]:\s*true/.test(src) &&
              /\[FeatureFlag\.BiometricsSDKIPC\]:\s*true/.test(src);
            if (!ok) { console.error("Flag defaults not forced on"); process.exit(1); }
            console.log("Flag defaults verified.");
          '

      - name: Verify webAuthenticationProxy permission in built manifest
        run: |
          node -e '
            const m = require("./apps/browser/build/manifest.json");
            if (!(m.permissions || []).includes("webAuthenticationProxy")) {
              console.error("webAuthenticationProxy missing from built manifest");
              process.exit(1);
            }
            console.log("Manifest OK", m.version);
          '

      - name: Package zip
        working-directory: apps/browser/build
        run: zip -r ../../../bitwarden-passkey-proxy-chrome.zip ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitwarden-passkey-proxy-chrome
          path: bitwarden-passkey-proxy-chrome.zip
          if-no-files-found: error
          retention-days: 30
